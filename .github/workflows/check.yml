name: 检查

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验脚本语法
        run: bash scripts/check.sh syntax

      - name: 检查关键文件
        run: bash scripts/check.sh payload

      - name: 安装 ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if ! (sudo apt-get update && sudo apt-get install -y shellcheck); then
              echo '::warning::ShellCheck installation failed; lint reports a skip if unavailable.'
            fi
          fi

      - name: ShellCheck
        run: bash scripts/check.sh lint

      - name: 隔离回归测试
        run: bash scripts/check.sh tests
