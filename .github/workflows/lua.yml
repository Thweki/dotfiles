name: Lua syntax

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 parser
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Parse Neovim configuration without loading plugins
        run: python3 -B scripts/check_lua.py
      - name: Test Lua syntax checker
        run: python3 -B -m unittest discover -s tests -p 'test_lua_syntax.py' -v
